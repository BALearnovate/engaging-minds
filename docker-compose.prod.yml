version: '3.8'

services:
  # 1. PostgreSQL Database Container (internal only, persistent)
  postgres:
    image: postgres:16-alpine
    container_name: engaging_minds_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-engaging_minds}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-engaging_minds}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - engaging_minds_network

  # 2. NestJS Backend Container (pulled from AWS ECR)
  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPO:-engaging-minds-backend}:${IMAGE_TAG:-latest}
    container_name: engaging_minds_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-engaging_minds}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - engaging_minds_network

  # 3. React Vite Frontend Container (pulled from AWS ECR)
  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPO:-engaging-minds-frontend}:${IMAGE_TAG:-latest}
    container_name: engaging_minds_frontend_prod
    restart: always
    networks:
      - engaging_minds_network

  # 4. Nginx Reverse Proxy Container (exposes Port 80 and Port 443 SSL)
  nginx:
    image: nginx:1.25-alpine
    container_name: engaging_minds_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - engaging_minds_network

  # 5. Certbot Container for Automatic SSL Certificate Renewal
  certbot:
    image: certbot/certbot
    container_name: engaging_minds_certbot_prod
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh"
    command: "-c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - engaging_minds_network

volumes:
  postgres_data:
    name: engaging_minds_postgres_data_prod

networks:
  engaging_minds_network:
    name: engaging_minds_network_prod
    driver: bridge
